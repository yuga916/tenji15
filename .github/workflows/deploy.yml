name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 主経路は ticker.yml からの workflow_dispatch(5分ごと・JST 8-22時、06:30に朝ビルド)。
    # GitHubのcronは高頻度指定が大幅に間引かれる(実測1日6回)ため、ここは保険のみ。
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-14 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "朝の番組確定ビルド(全ページIndexNow通知)"
        type: string
        default: "false"
      indexnow:
        description: "当日レースURLをIndexNow通知(毎時)"
        type: string
        default: "false"

permissions:
  contents: write   # data/days(答え合わせアーカイブ)をコミットして蓄積するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ハング防止(2026-09-13に5時間停止した実績あり)
    env:
      # OfficialDataSource実装後に 'official' へ(Settings > Variables)
      DATA_SOURCE_MODE: ${{ vars.DATA_SOURCE_MODE || 'mock' }}
      # 直前シグナル(展示・オッズ反映)。'official-live' で有効化(Settings > Variables)
      SIGNALS_MODE: ${{ vars.SIGNALS_MODE || 'off' }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # LZH解凍ツール(officialモードで公式配布ファイルの解凍に使用)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
      - run: npm run test:parser
      - run: npm run pipeline
      # X自動ポスト(Secrets未設定なら自動スキップ・失敗してもデプロイ継続)
      - name: X auto post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node --experimental-strip-types src/xPost.ts || echo "::warning::Xポスト失敗(継続)"
      # 日別データ(答え合わせアーカイブ)をリポジトリへコミットして蓄積。
      # [skip ci]でこのpushによる再実行ループを防ぐ。失敗してもデプロイは継続。
      - name: Commit data archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: 自動更新 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "::warning::データのpushに失敗(次回リトライ)"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: Bing(=ChatGPT検索が使うインデックス)へ更新を通知。
      # 5分ごとのデプロイ全部で送るとスパム的なので、朝の番組確定ビルド(21:30 UTC)のみ。
      - name: Notify IndexNow (daily)
        if: github.event.schedule == '30 21 * * *' || github.event.inputs.daily == 'true'
        run: |
          curl -s https://kyotei-chokuzen.com/sitemap.xml -o sitemap.xml || exit 0
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | head -500 | sed 's/.*/"&"/' | paste -sd, -)
          cat > payload.json <<EOF
          {"host":"kyotei-chokuzen.com","key":"8f3c1e7a2b9d4f6e0a5c8b1d7e3f9a24","keyLocation":"https://kyotei-chokuzen.com/8f3c1e7a2b9d4f6e0a5c8b1d7e3f9a24.txt","urlList":[${URLS}]}
          EOF
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data @payload.json -w "\nIndexNow HTTP %{http_code}\n" || echo "::warning::IndexNow通知失敗(継続)"
      # IndexNow(毎時): 当日のレースページ・当日まとめだけを開催時間帯に毎時通知。
      # ChatGPT検索(Bingインデックス)に「展示反映後の直前版」を拾わせて鮮度で差別化する。
      # ticker.yml が毎時0分の起動時に indexnow=true を渡してくる。
      - name: Notify IndexNow (hourly, today's races)
        if: github.event.inputs.indexnow == 'true'
        run: |
          curl -s https://kyotei-chokuzen.com/today-urls.txt -o today.txt || exit 0
          [ -s today.txt ] || exit 0
          URLS=$(grep -E '^https://' today.txt | head -500 | sed 's/.*/"&"/' | paste -sd, -)
          cat > payload.json <<EOF
          {"host":"kyotei-chokuzen.com","key":"8f3c1e7a2b9d4f6e0a5c8b1d7e3f9a24","keyLocation":"https://kyotei-chokuzen.com/8f3c1e7a2b9d4f6e0a5c8b1d7e3f9a24.txt","urlList":[${URLS}]}
          EOF
          echo "notify $(grep -c '^https://' today.txt) urls"
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data @payload.json -w "\nIndexNow HTTP %{http_code}\n" || echo "::warning::IndexNow通知失敗(継続)"
